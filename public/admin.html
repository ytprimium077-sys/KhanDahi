<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHAN दही — Admin</title><link rel="stylesheet" href="/admin.css"></head>
<body><div id="login" class="login"><div class="loginbox"><div class="mini">KHAN <b>दही</b></div><h1>Owner Panel</h1><p>Manage your brand, products and prices.</p><input id="user" placeholder="Username" autocomplete="username"><div class="password-wrap"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button type="button" id="togglePass" class="showpass" aria-label="Show password">Show</button></div><button id="loginBtn">Sign in</button><small id="loginMsg"></small></div></div>
<div id="app" class="app hidden"><header><div class="mini">KHAN <b>दही</b></div><button id="logout">Logout</button></header><main>
<section class="panel"><div class="panelhead"><div><span>STORE</span><h2>Products & pricing</h2></div><button id="newProduct">+ New Product</button></div><div id="products"></div></section>
<section class="panel"><div class="panelhead"><div><span>BRAND</span><h2>Website settings</h2></div><button id="saveSettings">Save settings</button></div><div class="grid"><label>Phone<input id="phone"></label><label>Email<input id="email"></label><label class="wide">Address<input id="address"></label><label class="wide">Hero video path<input id="heroVideo"></label></div></section>
<section class="panel"><div class="panelhead"><div><span>REVIEWS</span><h2>Customer reviews</h2></div><button id="newReview">+ Add review</button></div><div id="reviews"></div></section>
</main></div><script src="/admin.js"></script></body></html>
